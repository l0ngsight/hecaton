name: CI

on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tools/ci/check-repo-hygiene.sh
      - run: tools/ci/check-native.sh

  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: tools/ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hecaton-jar
          path: hecaton/target/hecaton-*.jar
          retention-days: 3

  client:
    name: Client (JDK ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: hecaton-jar
          path: hecaton/target
      - run: tools/ci/client-tests.sh
