name: CI

on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tools/ci/check-repo-hygiene.sh
      - run: tools/ci/check-native.sh

  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: tools/ci/build.sh
      - run: tools/ci/image-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hecaton-jar
          path: |
            hecaton/target/hecaton-*.jar
            hecaton-sql/target/hecaton-sql-*.jar
            hecaton-migrate/target/hecaton-migrate-*-cli.jar
          retention-days: 3

  migration:
    name: Migration tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: tools/ci/migration-tests.sh

  client:
    name: Client (JDK ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: hecaton-jar
      - run: tools/ci/client-tests.sh

  compat:
    name: Official clients
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: compat-tests/go/go.sum
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: hecaton-jar
      - run: compat-tests/run.sh
