name: Security analysis

# Static security analysis (spec §10, docs/security-review.md): CodeQL, OWASP dependency check
# and SpotBugs with FindSecBugs on Hecaton's own modules. Weekly, on demand, and when the
# workflow changes. Findings are reports to triage, not build failures.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/security.yml']

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  dependencies:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The NVD database of the previous run, so that a run downloads only the changes. It is
      # saved only when the job succeeds, never half-updated.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Dependency check
        env:
          # Without an NVD API key, NVD allows a few requests per 30 seconds: a full download
          # takes hours and ends with HTTP 429. Request a key at
          # https://nvd.nist.gov/developers/request-an-api-key and add it as the secret NVD_API_KEY.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          options=()
          if [[ -n "$NVD_API_KEY" ]]; then
            options+=(-DnvdApiKey="$NVD_API_KEY")
          else
            echo "::warning::The secret NVD_API_KEY is not set: the NVD download is rate-limited and may fail with HTTP 429."
          fi
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp org.owasp:dependency-check-maven:aggregate "${options[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check
          path: target/dependency-check-report.*

  spotbugs:
    name: SpotBugs (FindSecBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp -T 1C -DskipTests install
      - run: ./mvnw -B -ntp -Psecurity -DskipTests -pl hecaton,hecaton-hd,hecaton-persistence,hecaton-vector,hecaton-tiered verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs
          path: '*/target/spotbugs*.xml'
