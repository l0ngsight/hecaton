name: Security analysis

# Static security analysis (spec §10, docs/security-review.md): CodeQL, OWASP dependency check
# and SpotBugs with FindSecBugs on Hecaton's own modules. Weekly, on demand, and when the
# workflow changes. Findings are reports to triage, not build failures.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/security.yml']

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  dependencies:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Dependency check
        env:
          # without an NVD API key the database download is slow and rate-limited
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          options=()
          [[ -n "$NVD_API_KEY" ]] && options+=(-DnvdApiKey="$NVD_API_KEY")
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp org.owasp:dependency-check-maven:aggregate "${options[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check
          path: target/dependency-check-report.*

  spotbugs:
    name: SpotBugs (FindSecBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp -T 1C -DskipTests install
      - run: ./mvnw -B -ntp -Psecurity -DskipTests -pl hecaton,hecaton-hd,hecaton-persistence verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs
          path: '*/target/spotbugs*.xml'
