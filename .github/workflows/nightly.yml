name: Nightly tests

# Full test suite (`parallelTest` level: SlowTest/NightlyTest excluded), sharded across
# jobs. Logic lives in tools/ci/nightly.py and tools/ci/run-test-shard.sh of the tested ref,
# so this file only changes when the job layout does. Failures are compared with the
# failures inherited from Hazelcast 5.7.0 (docs/test-baseline/hazelcast-5.7.0.txt) and
# tools/ci/known-test-failures.txt; new, untriaged failures fail the run.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of this repository to test (and to take the tools from)'
        default: main

permissions:
  contents: read

concurrency:
  group: nightly-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

env:
  # Scheduled runs test main.
  REF: ${{ inputs.ref || 'main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          path: hc
      - id: matrix
        run: echo "matrix=$(python3 hc/tools/ci/nightly.py matrix)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          path: hc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: hc/**/pom.xml
      # The Python tests install the protobuf/grpcio versions pinned by the build, which do
      # not support the runner image's newer default Python (3.14); pin a supported one.
      - if: matrix.group == 'ext-streaming'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run shard
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: hc/tools/ci/run-test-shard.sh "$GROUP" "$SHARD" "$SHARDS"
      - if: always()
        name: Collect reports
        env:
          NAME: ${{ matrix.name }}
        # run-test-shard.sh keeps the parallel-JVM pass's reports in
        # target/surefire-reports-paralleljvm; suffix them so they do not replace the
        # single-JVM reports of the same class. Inline (not a script of the tested ref) so
        # it does not depend on the tested ref's scripts.
        run: |
          mkdir -p "reports/$NAME"
          { find hc -path '*/target/surefire-reports*/TEST-*.xml' 2>/dev/null || true; } |
            while IFS= read -r report; do
              suffix="$(basename "$(dirname "$report")")"
              cp "$report" "reports/$NAME/$(basename "$report" .xml)${suffix#surefire-reports}.xml"
            done
          echo "$(ls "reports/$NAME" | wc -l) report files"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.name }}
          path: reports
          retention-days: 14

  report:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          path: hc
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - name: Compare results
        run: |
          python3 hc/tools/ci/nightly.py report --reports reports \
            --baseline hc/docs/test-baseline/hazelcast-5.7.0.txt \
            --known hc/tools/ci/known-test-failures.txt \
            --failures-out failures.txt --summary-out summary.md
      - if: always()
        name: Publish summary
        run: |
          cat summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "----- BEGIN FAILING TESTS -----"
          cat failures.txt || true
          echo "----- END FAILING TESTS -----"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            failures.txt
            summary.md
          retention-days: 30
